<div
      class="w-[28px] h-[30px] mr-4 bg-slate-200 text-center my-3 rounded-md font-bold cursor-pointer"
      @click="dialogFormVisible = true"
    >
      +
    </div>

    <tr
          v-for="(item, index) in apiData"
          :key="index"
          class="hover:bg-gray-100 border-t"
        >
          <td class="py-2 px-3 text-[10px]">{{ item.Name }}</td>
          <td class="py-2 px-8 text-[10px]">{{ item.Contents }}</td>
          <td class="py-2 px-8 text-center text-[10px]">
            <span class="text-green-600 font-bold">{{ item.Status }}</span>
          </td>
          <td class="flex justify-end px-3 py-2 text-[10px]">
            <button class="text-blue-500 underline">{{ item.Action }}</button>
          </td>
        </tr>

        <!-- Data yang Ditambahkan -->
        <tr
          v-for="(item, index) in tableData"
          :key="'added-' + index"
          class="hover:bg-gray-100 border-t"
        >
          <td class="py-2 px-3 text-[10px]">{{ item.webName }}</td>
          <td class="py-2 px-8 text-[10px]">{{ item.reportTitle }}</td>
          <td class="py-2 px-8 text-center text-[10px]">
            <span class="text-orange-500 font-bold">Pending</span>
          </td>
          <td class="flex justify-end px-3 py-2 text-[10px]">
            <button class="text-blue-500 underline">View</button>
          </td>
        </tr>